name: Glaze
options:
  bundleIdPrefix: com.edwin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  GlazeCore:
    path: Packages/GlazeCore

targets:
  GlazeMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/GlazeMac
    dependencies:
      - package: GlazeCore
    settings:
      base:
        PRODUCT_NAME: Glaze
        PRODUCT_BUNDLE_IDENTIFIER: com.edwin.glaze
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JBN99YZ7KN
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
        Release:
          ENABLE_APP_SANDBOX: YES
          CODE_SIGN_ENTITLEMENTS: Packaging/Glaze.entitlements
    postbuildScripts:
      - name: "Stage VLC & ffmpeg tools"
        script: |
          exec "$SRCROOT/script/xcode_vlc_stage.sh"
        basedOnDependencyAnalysis: false

schemes:
  GlazeMac:
    build:
      targets:
        GlazeMac: all
    run:
      config: Debug
    archive:
      config: Release
