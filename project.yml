name: Glaze
options:
  bundleIdPrefix: com.edwin
  deploymentTarget:
    macOS: "26.0"
    tvOS: "18.0"
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GlazeCore:
    path: Packages/GlazeCore
  # Official VideoLAN binding, statically linked. Apple TV forbids dlopen, so the
  # runtime-loaded libvlc the Mac app uses cannot come along; this is the supported
  # way to play the same formats there. Pinned to an exact tag because 4.0 is still
  # an alpha series and the package points at a dated build of the xcframework.
  VLCKit:
    url: https://github.com/videolan/vlckit
    exactVersion: 4.0.0-a23

targets:
  GlazeMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/GlazeMac
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GlazeCore
        product: GlazeCore
      - package: GlazeCore
        product: GlazeTranscription
    settings:
      base:
        PRODUCT_NAME: Glaze
        PRODUCT_BUNDLE_IDENTIFIER: com.edwin.glaze
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JBN99YZ7KN
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
        Release:
          ENABLE_APP_SANDBOX: YES
          CODE_SIGN_ENTITLEMENTS: Packaging/Glaze.entitlements
    postbuildScripts:
      - name: "Stage VLC & ffmpeg tools"
        script: |
          exec "$SRCROOT/script/xcode_vlc_stage.sh"
        basedOnDependencyAnalysis: false

  GlazeTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/GlazeTV
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GlazeCore
        product: GlazeCore
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_NAME: Glaze
        PRODUCT_BUNDLE_IDENTIFIER: com.edwin.glaze
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/InfoTV.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JBN99YZ7KN
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  # iPhone and iPad. A client, not a workshop: the Mac makes the subtitles and writes
  # them beside the film, and this plays what is already there (docs/21). WhisperKit
  # would run here, but a phone is not where someone waits ten minutes for a
  # transcription — and leaving it out keeps the download small.
  GlazeiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/GlazeiOS
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GlazeCore
        product: GlazeCore
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_NAME: Glaze
        PRODUCT_BUNDLE_IDENTIFIER: com.edwin.glaze
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/InfoiOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JBN99YZ7KN
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  GlazeMac:
    build:
      targets:
        GlazeMac: all
    run:
      config: Debug
    archive:
      config: Release
  GlazeTV:
    build:
      targets:
        GlazeTV: all
    run:
      config: Debug
    archive:
      config: Release
  GlazeiOS:
    build:
      targets:
        GlazeiOS: all
    run:
      config: Debug
    archive:
      config: Release
