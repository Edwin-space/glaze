# Publishes site/ — the introduction, privacy policy, terms and support pages the
# App Store listing links to — to https://edwin-space.github.io/glaze/.
#
# Requires Settings → Pages → Source: "GitHub Actions" to be chosen once in the
# repository. Only site/ is published; docs/ stays a record in the repository.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "script/check_public_site.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate documents and local asset links
        run: python3 script/check_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check published documents and assets
        run: python3 script/check_public_site.py --base-url "$PAGES_URL"
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
